name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust tests and linting
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  # WASM build
  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM (web)
        run: wasm-pack build --target web --out-dir pkg

      - name: Build WASM (nodejs)
        run: wasm-pack build --target nodejs --out-dir pkg-node

      - name: Build WASM (bundler)
        run: wasm-pack build --target bundler --out-dir pkg-bundler

      - name: Check WASM size
        run: |
          echo "WASM binary sizes:"
          ls -lh pkg/*.wasm
          ls -lh pkg-node/*.wasm
          ls -lh pkg-bundler/*.wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v3
        with:
          name: wasm-build
          path: |
            pkg/
            pkg-node/
            pkg-bundler/

  # TypeScript/JavaScript tests
  js-test:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Download WASM artifacts
        uses: actions/download-artifact@v3
        with:
          name: wasm-build

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json

  # Build example
  example-build:
    name: Build Example
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Download WASM artifacts
        uses: actions/download-artifact@v3
        with:
          name: wasm-build

      - name: Install dependencies
        run: npm ci

      - name: Build example
        run: npm run example:build

      - name: Upload example artifacts
        uses: actions/upload-artifact@v3
        with:
          name: example-build
          path: dist/

  # All checks passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [rust-check, wasm-build, js-test, example-build]
    steps:
      - name: Success
        run: echo "All CI checks passed!"
